name: Test Suite

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        test-type: ["unit", "integration", "coverage"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        uv sync --dev
        uv pip install pytest pytest-asyncio pytest-cov pytest-mock
    
    - name: Run unit tests
      if: matrix.test-type == 'unit'
      run: |
        uv run pytest test/ -k "not integration" -v --tb=short
        echo "✅ Unit tests completed"
    
    - name: Run integration tests
      if: matrix.test-type == 'integration'
      run: |
        uv run pytest test/ -k "integration" -v --tb=short
        echo "✅ Integration tests completed"
    
    - name: Run tests with coverage
      if: matrix.test-type == 'coverage'
      run: |
        uv run pytest test/ -v --cov=cellxgene_mcp --cov-report=xml --cov-report=html --cov-report=term-missing
        echo "✅ Coverage tests completed"
    
    - name: Upload coverage to Codecov
      if: matrix.test-type == 'coverage'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  test-mcp-protocol:
    name: Test MCP Protocol
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        uv sync --dev
        uv pip install pytest pytest-asyncio pytest-mock
    
    - name: Test MCP server initialization
      run: |
        uv run python -c "
        import sys
        sys.path.insert(0, 'src')
        from cellxgene_mcp.server import CellxGeneMCP
        server = CellxGeneMCP(name='TestServer')
        print(f'✅ Server initialized: {server.name}')
        print(f'✅ Tools registered: {len(server.get_tools())}')
        print(f'✅ Resources registered: {len(server.get_resources())}')
        "
    
    - name: Test MCP tools registration
      run: |
        uv run python -c "
        import sys
        sys.path.insert(0, 'src')
        from cellxgene_mcp.server import CellxGeneMCP
        server = CellxGeneMCP(name='TestServer')
        
        tools = server.get_tools()
        expected_tools = [
            'cellxgene_get_census_info',
            'cellxgene_get_obs_metadata',
            'cellxgene_get_var_metadata',
            'cellxgene_get_data_slice',
            'cellxgene_get_all_cell_types'
        ]
        
        tool_names = [tool.name for tool in tools]
        missing_tools = [tool for tool in expected_tools if tool not in tool_names]
        
        if missing_tools:
            print(f'❌ Missing tools: {missing_tools}')
            sys.exit(1)
        else:
            print('✅ All expected tools registered')
        "
    
    - name: Test MCP resources registration
      run: |
        uv run python -c "
        import sys
        sys.path.insert(0, 'src')
        from cellxgene_mcp.server import CellxGeneMCP
        server = CellxGeneMCP(name='TestServer')
        
        resources = server.get_resources()
        expected_resources = ['resource://cellxgene_census-info']
        
        resource_names = [resource.name for resource in resources]
        missing_resources = [res for res in expected_resources if res not in resource_names]
        
        if missing_resources:
            print(f'❌ Missing resources: {missing_resources}')
            sys.exit(1)
        else:
            print('✅ All expected resources registered')
        "

  test-dependencies:
    name: Test Dependencies
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        uv sync --dev
    
    - name: Test import statements
      run: |
        uv run python -c "
        # Test all critical imports
        import cellxgene_census
        import pandas
        import numpy
        import anndata
        import h5py
        import boto3
        import botocore
        import fastmcp
        import fastapi
        import eliot
        import pycomfort
        
        print('✅ All dependencies imported successfully')
        "
    
    - name: Test Census connectivity (basic)
      run: |
        uv run python -c "
        import cellxgene_census
        
        # Test basic Census functionality without opening connection
        try:
            versions = cellxgene_census.get_census_version_directory()
            print(f'✅ Census versions available: {list(versions.keys())}')
        except Exception as e:
            print(f'⚠️  Census connectivity test failed: {e}')
            print('This is expected in CI environment without proper credentials')
        "

  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        uv sync --dev
        uv pip install black isort flake8 mypy
    
    - name: Check code formatting with Black
      run: |
        uv run black --check --diff src/ test/
    
    - name: Check import sorting with isort
      run: |
        uv run isort --check-only --diff src/ test/
    
    - name: Lint with flake8
      run: |
        uv run flake8 src/ test/ --max-line-length=88 --extend-ignore=E203,W503
    
    - name: Type check with mypy
      run: |
        uv run mypy src/ --ignore-missing-imports --no-strict-optional

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        uv sync --dev
        uv pip install safety bandit
    
    - name: Check for known security vulnerabilities
      run: |
        uv run safety check --json --output safety-report.json || true
        echo "Safety check completed"
    
    - name: Run Bandit security linter
      run: |
        uv run bandit -r src/ -f json -o bandit-report.json || true
        echo "Bandit security scan completed"
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json
        retention-days: 30
