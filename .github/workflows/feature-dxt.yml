name: Feature Branch DXT Builder

# This workflow specifically builds DXT files for feature branches
# It runs automatically on any branch that starts with "feature/"

on:
  push:
    branches:
      - 'feature/**'  # Triggers on ALL feature branches
  pull_request:
    branches:
      - 'main'
      - 'develop'
    types: [opened, synchronize, reopened]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-feature-dxt:
    runs-on: ubuntu-latest
    name: Build DXT for ${{ github.ref_name }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
        
    - name: Set up Python
      run: uv python install 3.11
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Extract feature branch info
      id: feature_info
      run: |
        BRANCH_NAME="${{ github.ref_name }}"
        
        # Handle both direct pushes and pull requests
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          BRANCH_NAME="${{ github.head_ref }}"
        fi
        
        # Extract feature name and create version
        FEATURE_NAME=$(echo "$BRANCH_NAME" | sed 's/feature\///' | sed 's/\//-/g' | sed 's/_/-/g')
        VERSION="feature-${FEATURE_NAME}-$(date +%Y%m%d-%H%M%S)"
        COMMIT_SHORT="${{ github.sha }}" && COMMIT_SHORT="${COMMIT_SHORT:0:8}"
        
        echo "feature_name=$FEATURE_NAME" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "commit_short=$COMMIT_SHORT" >> $GITHUB_OUTPUT
        echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
        
        echo "Feature Branch Build Configuration:"
        echo "  - Branch: $BRANCH_NAME"
        echo "  - Feature: $FEATURE_NAME"
        echo "  - Version: $VERSION"
        echo "  - Commit: $COMMIT_SHORT"
        echo "  - Event: ${{ github.event_name }}"
        
    - name: Build DXT package
      run: |
        echo "🔨 Building DXT package for feature branch..."
        cd build-dxt
        make build VERSION=${{ steps.feature_info.outputs.version }}
        
        # Verify the DXT was built
        ls -la dist/
        echo "✅ DXT package built successfully"
        
    - name: Test DXT package
      run: |
        echo "🧪 Testing DXT package..."
        cd build-dxt
        make test VERSION=${{ steps.feature_info.outputs.version }}
        echo "✅ DXT package tested successfully"
        
    - name: Upload DXT artifact
      uses: actions/upload-artifact@v4
      with:
        name: cellxgene-mcp-${{ steps.feature_info.outputs.feature_name }}-${{ steps.feature_info.outputs.commit_short }}-dxt
        path: build-dxt/dist/cellxgene-mcp-${{ steps.feature_info.outputs.version }}.dxt
        retention-days: 30
        
    - name: Create feature branch comment (PR only)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && 
            comment.body.includes('DXT Build Complete')
          );
          
          const commentBody = `## 🎯 Feature Branch DXT Build Complete!

          **Feature:** \`${{ steps.feature_info.outputs.feature_name }}\`
          **Version:** \`${{ steps.feature_info.outputs.version }}\`
          **Commit:** \`${{ steps.feature_info.outputs.commit_short }}\`
          
          ### 📦 DXT Package Ready
          The DXT package has been built and is available for testing.
          
          ### 🔍 Download DXT
          Download the DXT file from the [Actions tab](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          ### 🧪 Testing Instructions
          1. Download the DXT file from the Actions artifacts
          2. Install in Claude Desktop for testing
          3. Test the new features
          4. Report any issues in this PR
          
          ### 📋 Build Details
          - **Branch:** \`${{ steps.feature_info.outputs.branch_name }}\`
          - **Build Time:** \`${{ steps.feature_info.outputs.version }}\`
          - **Status:** ✅ Success
          
          ---
          *This comment was automatically generated by the Feature Branch DXT Builder workflow*`;
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: commentBody
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
          }
        
    - name: Output build summary
      run: |
        echo "=================================================="
        echo "🎉 Feature Branch DXT Build Complete!"
        echo "=================================================="
        echo "Feature: ${{ steps.feature_info.outputs.feature_name }}"
        echo "Version: ${{ steps.feature_info.outputs.version }}"
        echo "Commit: ${{ steps.feature_info.outputs.commit_short }}"
        echo "Branch: ${{ steps.feature_info.outputs.branch_name }}"
        echo ""
        echo "DXT package uploaded as artifact:"
        echo "cellxgene-mcp-${{ steps.feature_info.outputs.feature_name }}-${{ steps.feature_info.outputs.commit_short }}-dxt"
        echo ""
        echo "Download from: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo "=================================================="
