[project]
name = "cellxgene-mcp"
version = "0.1.0"
description = "MCP for CZ CELLxGENE Discover Census"
readme = "README.md"
authors = [
    { name = "antonkulaga", email = "antonkulaga@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "eliot>=1.17.5",
    "pycomfort>=0.0.18",
    "fastmcp>=2.8.0",
    "fastapi>=0.115.12",
    "cellxgene-census>=1.17.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0,<2.0",
    "anndata>=0.8.0,<1.0",
    "h5py>=3.0.0,<4.0",
    "boto3>=1.26.0",
    "botocore>=1.29.0"
]

[project.scripts]
cellxgene-mcp = "cellxgene_mcp.server:cli_app_stdio"
server = "cellxgene_mcp.server:cli_app"
stdio = "cellxgene_mcp.server:cli_app_stdio"
sse = "cellxgene_mcp.server:cli_app_sse"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cellxgene_mcp"]

[tool.hatch.build]
exclude = [
    "*.log",
    "logs/",
    "images/",
    ".venv/",
    ".pytest_cache/",
    "test/",
    # Exclude temporary files
    "temp*.h5ad",
    "temp*.csv",
    "debug*.h5ad",
]

[dependency-groups]
dev = [
    "just-agents-core>=0.7.4",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.8.0",
] 